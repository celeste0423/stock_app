name: Portfolio news alerts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: portfolio-news-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STOCK_ALERT_HOLDINGS_JSON: ${{ secrets.STOCK_ALERT_HOLDINGS_JSON }}
      STOCK_ALERT_CACHE_PATH: .alert_state/portfolio_news_alert_cache.json
      STOCK_ALERT_NEWS_DAYS: "2"
      STOCK_ALERT_LIMIT_PER_STOCK: "3"
      STOCK_ALERT_MAX_ALERTS: "10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore alert state
        id: restore-alert-state
        uses: actions/cache/restore@v4
        with:
          path: .alert_state
          key: portfolio-news-alert-state-${{ github.run_id }}
          restore-keys: |
            portfolio-news-alert-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check portfolio news
        run: python tools/portfolio_news_alert.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert_state
          key: portfolio-news-alert-state-${{ github.run_id }}
